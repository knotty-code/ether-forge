---
anchors:
  thresholds-operstate: &thresholds-operstate
    - color: "#FF3154" # red
      level: 0
    - color: "#4BDD33" # green
      level: 1

  thresholds-traffic: &thresholds-traffic
    - color: "#bec8d2" # grey
      level: 0
    - color: "#4BDD33" # green
      level: 199999
    - color: "#FFFF00" # yellow
      level: 500000
    - color: "#FF8000" # orange
      level: 1000000
    - color: "#FF3154" # red
      level: 5000000

  label-config: &label-config
    separator: replace
    units: bps
    decimalPoints: 1
    valueMappings:
      - valueMax: 199999
        text: ""
      - valueMin: 200000

cellIdPreamble: cell-

cells:
  # Your working port example (keep as-is)
  reno-e1:c1-1:
    dataRef: oper-state:isp1:1/1/c1/1
    fillColor:
      thresholds: *thresholds-operstate

  # Link line color (assuming this works)
  link_id:reno-e1-c1-1:
    dataRef: isp1:1/1/c1/1:out   # ← adjust if your alias is different
    strokeColor:
      thresholds: *thresholds-traffic

  # Throughput label – target the exact ID you added
  label-link:reno-e1-c1-1:
    dataRef: isp1:1/1/c1/1:out   # ← MUST match your legend format exactly!
    label: *label-config          # Use your config anchor for formatting
    # Or inline if you prefer:
    # label:
    #   value: true
    #   format: "{:.1f} bps"
    #   decimalPoints: 1
    #   units: bps